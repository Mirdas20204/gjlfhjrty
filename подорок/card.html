<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <title>Твоя открытка</title>
</head>
<body>
  <div class="page-wrap">
    <div class="header-row">
      <div class="greeting" id="greeting">я тебя люблю🤍</div>
    </div>

    <div class="scene">
      <div class="card" id="card" title="Нажми, чтобы открыть">
        <div class="card__inner">
          <div class="card__front">
            <div class="front-text">Нажми, чтобы открыть</div>
          </div>
          <div class="card__back">
            <div class="message" id="message">вот мое сердечко</div>
            <div class="heart" id="heart">🤍</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
