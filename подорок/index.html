<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <title>Подарок — шаг 1</title>
</head>
<body>
  <div class="page-wrap">
    <div class="form-card">
      <h1>Привет!</h1>
      <p>Как меня зовут?</p>
      <form id="nameForm">
        <input id="nameInput" name="name" type="text" required placeholder="Введите имя" autocomplete="off" />
        <button type="submit">Далее</button>
      </form>
      <div id="error" class="error" aria-live="polite"></div>
    </div>
  </div>

  <script>
    // ожидаемое имя (регистронезависимо)
    var EXPECTED_NAME = 'мирдас';

    var nameForm = document.getElementById('nameForm');
    var nameInput = document.getElementById('nameInput');
    var errorEl = document.getElementById('error');

    nameForm.addEventListener('submit', function(e){
      e.preventDefault();
      var v = (nameInput.value || '').trim().toLowerCase();
      if(v === EXPECTED_NAME) {
        // сохраняем правильную форму имени (первую букву заглавной)
        localStorage.setItem('guestName', EXPECTED_NAME.charAt(0).toUpperCase() + EXPECTED_NAME.slice(1));
        location.href = 'info.html';
      } else {
        errorEl.textContent = 'Не угадала — попробуй ещё.';
        nameInput.classList.add('shake');
        setTimeout(function(){ nameInput.classList.remove('shake'); }, 500);
      }
    });

    nameInput.addEventListener('input', function(){
      errorEl.textContent = '';
    });
  </script>
</body>
</html>
